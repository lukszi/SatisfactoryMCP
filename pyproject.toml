[project]
name = "satisfactory-mcp"
version = "0.1.0"
description = "MCP server for planning Satisfactory factories"
# PEP 639 licence expression. PolyForm Noncommercial is not OSI-approved and has no
# standard SPDX id, so it is named by LicenseRef pointing at the full text in LICENSE.
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # <2: mcp 2.0.0 drops mcp.server.fastmcp. uv.lock is tracked, but installs that ignore it
    # (pip, `uv sync --upgrade`) resolve from this range, and an unbounded one pulled 2.0.0
    # into a fresh environment and failed all 23 test modules at collection.
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.13",
    "platformdirs>=4.0",
    "scipy>=1.11",
    "numpy>=1.26",
]

[project.scripts]
satisfactory-mcp = "satisfactory_mcp.server:main"
satisfactory-mcp-web = "satisfactory_mcp.interfaces.web.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "pytest-xdist>=3.6,<4", "ruff"]
# The web interface is optional on purpose: the MCP server is the product, and a
# stdio server has no business pulling in an ASGI stack. interfaces/web is the only
# place allowed to import these, which tests/architecture/test_import_direction.py enforces.
web = ["fastapi>=0.115", "uvicorn>=0.30"]
# What the tools/ generators need to open the game's own container, and nothing in this
# repository imports at module scope: `ooz` (from pyooz) decompresses the container's
# blocks, texture2ddecoder unpacks BC1 texture blocks and Pillow writes the PNGs. Optional
# means optional AT IMPORT TIME -- the server, the parser and the domain run with none of
# them installed, and the only import of one under src/ is the lazy `import ooz` inside
# core.gameassets.iostore.oodle_decompress, which tests/architecture/test_optional_extras.py
# enforces the same way it does for the web stack. Exact pins, because these three decide the
# BYTES the generators write and a silent upgrade would be a silent redraw: they are the
# versions every previous run of every generator used, recorded off those runs' environments.
# zstandard is the render caches' codec (docs/spatial-and-map.md section 39), pinned the
# same way because it decides the bytes of a kept cache.
gen = ["pyooz==0.0.8", "texture2ddecoder==1.0.6", "pillow==12.3.0", "zstandard==0.25.0"]

[tool.uv.workspace]
# The map generators: not shipped in the wheel below, run as `python -m mapgen <command>`.
members = ["tools/mapgen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two packages, because the parser is a standalone library that happens to live here: the
# extractor subprocess imports `pioneersav` by name, so it has to be installed beside the
# application rather than inside it.
packages = ["src/satisfactory_mcp", "src/pioneersav"]
# The map page's npm project is build-time only. What the server serves is what the build
# WROTE -- interfaces/web/static, untracked build output -- so shipping the TypeScript
# beside it would put a second copy of the page in the wheel, one of which nothing ever
# reads. A wheel built on a machine that has run `npm run build` carries the page; one
# built from a bare clone simply does not, and the server says how to build it at `/`.
# `node_modules` is already out by way of .gitignore; this excludes the sources it builds.
exclude = ["src/satisfactory_mcp/interfaces/web/frontend"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/mapgen/tests"]
# The repository root makes `tests.support` and `tools` importable; mapgen is a workspace
# member found here before `uv sync --all-packages` has run.
pythonpath = [".", "tools/mapgen/src"]
markers = [
    "integration: requires the real game install / save files",
    "whole_folder: walks every .sav on the machine; the longest tests in the suite",
]
# Why the default run deselects integration, and why eight workers: docs/DEVELOPING.md,
# "Test suite".
addopts = ["-m", "not integration", "-n", "8", "--import-mode=importlib"]

[tool.coverage.run]
source = ["src", "tools"]
omit = ["tools/mapgen/tests/*"]
# Paths in coverage.xml relative to the root, so a scanner in a container can map them.
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# MEASURED against ruff 0.16 before being written, because three of the four entries
# below used to be a statement about a rule set this project does not select and one of
# them was doing nothing at all. Counted by selecting each rule alone over src, tests and
# tools: BLE001 70, C408 46, S110 2 -- all three are in ruff's default set and all three
# ignores are load-bearing. E402 is NOT in that set (the only pycodestyle E rules it
# carries are E722 and E902), so the E402 entry suppressed nothing and the comment above
# it described a rule that was never running.
#
# So E402 is switched ON rather than deleted, because the sentence it was trying to make
# is worth enforcing and the enforcement is what makes the exemption mean something. The
# 32 hits split three ways when it was measured: 19 in tools/, which is the documented
# case; 12 in test_web_api.py behind a `pytest.importorskip`, which is the same case; and 1
# in domain/planning/scenario.py, which was a plain stray import sitting 40 lines below the
# import block for no reason and is now at the top of it. That one defect is the whole
# argument for selecting the rule instead of writing prose about it.
#
# The count has moved since and the SHAPE has not, which is the part worth recording: 74
# hits now, 31 in tools/ and 43 in tests/, and every one of the 43 is the same
# `importorskip` line -- test_web_api.py's 12 became one file per router, so the number
# grew with the number of web test modules while the exempt pattern stayed two globs and a
# name. Nothing outside those two cases has ever been exempted.
extend-select = ["E402"]
ignore = [
    # Broad excepts are deliberate at the save boundary: autosaves are rewritten in
    # place every ~5 minutes, so a parse can tear mid-write, and the vendored parser
    # raises freely. Degrading to "could not read save" beats crashing the server.
    "BLE001",
    # try/except/pass, on the two best-effort reads in tools/spatial.py: a heightfield
    # that is not on this machine costs the elevation column and nothing else.
    "S110",
    # `dict(a=1)` over `{"a": 1}`, in the payload builders where the keyword form is
    # what the fields read as. This one is a house style, not a boundary.
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# The two places a module-level import legitimately follows executable code, and the only
# two: a generator that puts the repository root on sys.path before importing `tools`, and
# a test module that asks `pytest.importorskip` whether the optional web stack is here at
# all before importing from it. Anywhere else, E402 is a stray import and now says so.
#
# The web tests are a file per router, in folders that mirror the router packages, and every
# one of them opens with that same `importorskip` -- so the pattern is `tests/web/**/*.py`
# rather than a list that has to grow with each split. It stays narrow: only the web suite
# may import after code.
#
# `tests/mapgen/test_generators.py` is named rather than globbed in: it is the tools-side half
# of the same split -- it holds the two map generators against the endpoint that serves what
# they write, so it drives the app and opens with the identical `importorskip` -- and it is
# one file, not a family, so a name says more here than a wildcard would.
"tools/*.py" = ["E402"]
"tests/web/**/*.py" = ["E402"]
"tests/mapgen/test_generators.py" = ["E402"]

[tool.ruff.lint.isort]
# Stated rather than inferred. isort decides first-party by resolving the dotted name on
# disk, so an import that runs through a package whose submodules live elsewhere -- every
# ``satisfactory_mcp.planning.*`` line in the test suite for as long as the shims stand --
# reclassifies as third-party and reorders the whole block. Naming the two packages makes
# the sections depend on what the code IS, not on where it happens to sit today.
known-first-party = ["satisfactory_mcp", "pioneersav", "mapgen"]
