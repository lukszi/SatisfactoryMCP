sonar.projectKey=satisfactory-mcp
sonar.projectName=SatisfactoryMCP
sonar.sourceEncoding=UTF-8

# src holds the frontend's TypeScript too; tools holds tools/mapgen/src. The frontend's and
# mapgen's tests sit inside those trees, so they are tests here and excluded from the sources.
sonar.sources=src,tools
sonar.tests=tests,tools/mapgen/tests,src/satisfactory_mcp/interfaces/web/frontend/test
# requires-python is >=3.11; 3.13 is the development interpreter.
sonar.python.version=3.11,3.12,3.13

# Explicit rather than left to .gitignore: a worktree's .git link does not resolve inside
# the scanner container. schema.d.ts is generated from the server's OpenAPI document.
sonar.exclusions=tools/mapgen/tests/**,\
  src/satisfactory_mcp/interfaces/web/frontend/test/**,\
  src/satisfactory_mcp/interfaces/web/frontend/coverage/**,\
  **/node_modules/**,\
  **/static/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  data/**,\
  src/satisfactory_mcp/interfaces/web/frontend/src/api/schema.d.ts
sonar.test.exclusions=tests/fixtures/**,**/__pycache__/**

# Written by `pytest --cov --cov-report=xml` and by the frontend's `npm test`, whose posttest
# step writes lcov.info's source paths with `/` so the Linux scanner resolves them.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=src/satisfactory_mcp/interfaces/web/frontend/coverage/lcov.info
