# Apache 2.4: the shared map (python -m mapgen share-export) under a path prefix of an
# existing HTTPS site. Static files only, no login. docs/map/sharing.md explains each block.
#
# Placeholders, replace all of them:
#   @PREFIX@  the URL path, no trailing slash, for example /map
#   @DIR@     the export folder on the server, for example /var/www/map
#
# Include it inside the site's HTTPS <VirtualHost>. Needs mod_alias, mod_headers, mod_mime,
# mod_dir, mod_setenvif and mod_deflate; mod_expires and mod_rewrite are not used.

# TRACE is answered before any access rule; Debian's security.conf turns it off too.
TraceEnable off

RedirectMatch 301 "^@PREFIX@$" "@PREFIX@/"
Alias "@PREFIX@/" "@DIR@/"

<Directory "@DIR@">
    Options -Indexes -FollowSymLinks -ExecCGI -Includes -MultiViews
    AllowOverride None
    DirectoryIndex index.html
    Require all granted

    # GET and HEAD only; no dotfiles; only the file types an export holds.
    <If "! (%{REQUEST_METHOD} in {'GET', 'HEAD'}) || %{REQUEST_URI} =~ m#/\.# || %{REQUEST_URI} !~ m#(/|\.(html|js|css|json|png|webp|txt))$#">
        Require all denied
    </If>

    AddType text/html .html
    AddType text/javascript .js
    AddType text/css .css
    AddType application/json .json
    AddType image/png .png
    AddType image/webp .webp
    AddType text/plain .txt
    AddCharset utf-8 .html .js .css .json .txt

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'none'; object-src 'none'; manifest-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), bluetooth=(), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=(), xr-spatial-tracking=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"

    # Tile folders and page assets carry a build tag or a content hash in their path, so
    # they never change: cache for a year. The page and the two manifests: always revalidate.
    <If "%{REQUEST_URI} =~ m#^@PREFIX@/(t|assets)/#">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </If>
    <Else>
        Header always set Cache-Control "no-cache"
    </Else>

    # Compress the script and the manifests only; PNG and WebP are compressed already.
    SetEnvIf Request_URI "(/|\.(html|css|txt|png|webp))$" no-gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/javascript application/json
    </IfModule>
</Directory>
